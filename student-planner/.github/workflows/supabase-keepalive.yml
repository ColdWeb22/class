name: Supabase Keepalive

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase-backed health endpoint
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          URL="${KEEPALIVE_URL:-https://student-planner-api.onrender.com/api/health/supabase}"
          curl --fail --show-error --silent --max-time 30 "$URL"
